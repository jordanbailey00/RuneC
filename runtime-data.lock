# Runtime data lock for RuneC-Testing; live RuneC releases are independent.

format = "runec-runtime-data-lock-v1"
status = "prerelease"
official_release = false
data_version = "v1"
release_status = "blocked"
pipeline_command = "python3 tools/data_pipeline.py all"
check_command = "python3 tools/data_pipeline.py --check"

[local_outputs]
data_manifest = "data/manifest.json"
dist_manifest = "dist-data/manifest.json"
packs_dir = "dist-data/packs"
pipeline_record = "generated/pipeline/build.json"
reports_dir = "generated/reports"
local_setup_command = "scripts/setup-data.sh --offline dist-data"
local_verify_command = "scripts/setup-data.sh --verify"

[release]
manifest_url = "https://github.com/jordanbailey00/RuneC-Testing/releases/download/data-v2026.10.21-b237/manifest.json"
manifest_sha256 = "fab0fda9a1563244a2427bca7b58dc34247efc43623df19453e2040ef6d46464"
packs_base_url = "https://github.com/jordanbailey00/RuneC-Testing/releases/download/data-v2026.10.21-b237"
release_tag = "data-v2026.10.21-b237"

[source_gaps]
datasets = []

[notes]
phase = "testing-full-world-loot-checkpoint"
official_release_note = "RuneC-Testing dev runtime-data checkpoint; v1 is the compatibility identifier, not the release date. Live RuneC is unchanged."
source_gap_note = "No formal source-authority gaps remain; rejected loot tables and incomplete content parity remain documented in content/loot and docs/TODO.md."
release_gate_note = "Explicit Testing use only. Official release remains blocked by unfinished loot, unavailable prayer effects and an outdated gathering-count report; runtime tests do not certify content parity."
