# Regular combat NPC family mechanics.
# This owns data classification only; combat/slayer code consumes the compiled
# binary and implements behavior per tag.

schema_version = 2

[[families]]
key = "dragonfire_users"
status = "runtime_indexed"
summary = "Adult dragon-family NPCs that use dragonfire and need antifire/shield/prayer mitigation."
exact_names = [
  "Green dragon", "Blue dragon", "Red dragon", "Black dragon",
  "Bronze dragon", "Iron dragon", "Steel dragon", "Mithril dragon",
  "Adamant dragon", "Rune dragon", "Lava dragon", "Brutal green dragon",
  "Brutal blue dragon", "Brutal red dragon", "Brutal black dragon",
  "King Black Dragon", "Elvarg", "Vorkath"
]
exclude_names = [
  "Baby blue dragon", "Baby red dragon", "Baby green dragon",
  "Baby black dragon", "Dragon impling", "Dragon display",
  "Prince Black Dragon"
]
tags = ["dragonfire", "equipment_mitigation", "potion_mitigation", "prayer_interaction"]
required_systems = ["combat", "equipment", "inventory", "prayer", "consumables"]
sources = ["OSRS Wiki: Dragonfire", "OSRS Wiki: Anti-dragon shield", "OSRS Wiki: Dragonfire shield"]

