# Discord is one projectile that lands as melee, ranged or magic.
[[attacks]]
name = "Discord (melee)"
style = "crush"
max_hit = 28
weight_adjacent = 1
weight_distant = 1
range = 10

[[attacks]]
name = "Discord (ranged)"
style = "ranged"
max_hit = 28
weight_adjacent = 1
weight_distant = 1
range = 10

[[attacks]]
name = "Discord (magic)"
style = "magic"
max_hit = 28
weight_adjacent = 2
weight_distant = 2
range = 10

# Teleports the player a short distance away.
[[attacks]]
name = "Confusion"
style = "magic"
weight_adjacent = 1
weight_distant = 1
range = 10
flags = ["no_damage"]
effect = { kind = "teleport_away", when = "always", min_distance = 2, max_distance = 5 }

# Unequips up to four items, weapon first, limited by free inventory slots;
# never used while the inventory is full.
[[attacks]]
name = "Madness"
style = "magic"
weight_adjacent = 1
weight_distant = 1
range = 10
flags = ["no_damage", "needs_free_slot"]
effect = { kind = "unequip", when = "always", count = 4 }

[[phases]]
id = "fight"
