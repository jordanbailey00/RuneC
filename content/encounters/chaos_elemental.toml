# Clan Cup copy).
#
# PROVISIONAL (no source found, awaiting sign-off): attack odds beyond
# "Discord is magic most often", and Confusion's 2-5 tile teleport distance.

name = "Chaos Elemental"
slug = "chaos_elemental"
support = "full"
respawn_ticks = 14
source_pages = ["Chaos Elemental", "Chaos Elemental/Strategies"]

[[forms]]
id = "elemental"
npc_id = 2054
