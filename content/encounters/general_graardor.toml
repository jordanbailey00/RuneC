# from B237 NDEF (2215, bodyguards 2216-2218).
# Room: Graardor and his three bodyguards fight only players inside the
# Bandos boss room (2009scape GodwarsBossNPC chamber 2864,5351 - 2876,5369,
# plane 2, which holds every world spawn of the four). Bodyguards killed
