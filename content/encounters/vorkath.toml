# Vorkath (oracle WB-043). Evidence: OSRS Wiki Vorkath/Strategies r15364644
# and Dragonfire; identities from B237 NDEF (8059 sleeping with Poke, 8061
# awake; 8058 has no options, 8060 and 8062 are quest copies; 8063 is the
# Zombified Spawn) and B237 loc 32000 "Acid pool" (RuneLite ObjectID
# VORKATH_ACID). Presentation rows: content/combat_visuals/visuals.tsv.
#
# Accepted without a source (user sign-off 2026-10-21): standard attack weights
# beyond "ranged 4 : magic 3, magic more often in melee distance"; the wake
# delay; deadly dragonfire's flight time; acid pool count, radius and
# lifetime; the acid and spawn flight times; rapid-fire strike flight time;
# that Vorkath does not attack while the spawn lives.
#
# Vorkath never leaves its spot (user direction 2026-10-22; OSRS moverestrict
# nomove), so both forms are anchored and its distant attacks reach the whole
# arena. The arena is 23x23 around it and its farthest tile is 8 away
# (B237 collision; Vorkath/Strategies r15364644: from the perimeter row a
# range-7 crossbow is out of range, range 8 or more always reaches).

name = "Vorkath"
slug = "vorkath"
support = "full"
# Leaving or dying puts Vorkath back to sleep at full health.
disengage = "reset"
respawn_ticks = 1
source_pages = ["Vorkath", "Vorkath/Strategies", "Dragonfire"]

# Poking the sleeping form (rc-content/encounters/vorkath.c) wakes it.
[[forms]]
id = "asleep"
npc_id = 8059
name = "Vorkath"
binds = true
dormant = true
anchored = true
next = "awake"
next_hp = "full"
transition_ticks = 5

[[forms]]
id = "awake"
npc_id = 8061
name = "Vorkath"
anchored = true

[[helpers]]
id = "spawn"
npc_id = 8063
name = "Zombified Spawn"

# Spawned under each landed acid pool (centrepiece loc, no clipping).
[[objects]]
id = "acid"
object_id = 32000
name = "Acid pool"
type = 10

# Six standard attacks, then a special. Specials alternate acid / spawn and
# the first is random.
[[attacks]]
name = "Melee"
style = "slash"
max_hit = 32
weight_adjacent = 2
flags = ["diagonal_reach"]

[[attacks]]
name = "Magic"
style = "magic"
max_hit = 30
weight_adjacent = 4
weight_distant = 3
range = 8

[[attacks]]
name = "Ranged"
style = "ranged"
max_hit = 32
weight_adjacent = 3
weight_distant = 4
range = 8

[[attacks]]
name = "Dragonfire"
style = "magic"
max_hit = 80
weight_adjacent = 1
weight_distant = 1
range = 8
breath = "vorkath"

# Dragonfire protection reduces the damage, never the venom.
[[attacks]]
name = "Venomous dragonfire"
style = "magic"
max_hit = 75
weight_adjacent = 1
weight_distant = 1
range = 8
breath = "vorkath_coloured"
effect = { kind = "venom", when = "always", damage = 6 }

# Dragonfire protection reduces the damage; prayers still switch off.
[[attacks]]
name = "Corrupting dragonfire"
style = "magic"
max_hit = 75
weight_adjacent = 1
weight_distant = 1
range = 8
breath = "vorkath_coloured"
effect = { kind = "deactivate_prayers", when = "always" }

# Launched at the player's tile; half damage beside it; no protection applies.
[[attacks]]
name = "Deadly dragonfire"
style = "magic"
max_hit = 121
weight_adjacent = 1
weight_distant = 1
range = 8
hit_delay = 4
adjacent_pct = 50
flags = ["tile_target", "ignores_protection"]

[[phases]]
id = "fight"

[[mechanics]]
name = "Special rotation"
primitive = "attack_counter_alternate_special"
trigger = "attack_count"
params = { every_n_attacks = 7, specials = ["Acid phase", "Zombified spawn"], random_first = true }

# Acid spat around the arena lands as pools (one under the player) that heal
# Vorkath for the damage they deal; 25 fireballs follow, one per tick at the
# player's tile, 25-41 each through any protection. Vorkath takes half
# damage meanwhile.
[[mechanics]]
name = "Acid phase"
primitive = "acid_field"
trigger = "attack_count"
params = { pool_count = 12, pool_radius = 6, pool_damage_max = 10, pool_leech_pct = 100, pool_ticks = 30, pool_object = "acid", pool_delay = 2, strike_count = 25, strike_delay = 2, strike_min = 25, strike_max = 41, damage_taken_pct = 50, strike_style = "magic" }

# Icy breath freezes the player; the spawn is launched ten tiles away, walks
# over and explodes for up to 60 scaled by its health. Crumble Undead kills
# it outright. Vorkath is immune until it is gone, which also ends the
# freeze.
[[mechanics]]
name = "Zombified spawn"
primitive = "spawn_owned_helpers"
trigger = "attack_count"
params = { helper = "spawn", count = 1, spawn_distance = 10, spawn_delay = 3, explode_max = 60, boss_immune = true, freeze_player = true, boss_idle = true, instakill_spell = "Crumble Undead" }
