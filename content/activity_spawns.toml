  "Local static spawn and locline surfaces do not expose Nex or bodyguard runtime spawn tiles by exact name.",
  "OSRS Wiki confirms bodyguards occupy phase/corner roles, but does not expose exact runtime spawn tiles in the cached page/API surface.",
  "RuneLite provides IDs only: Nex 11278..11282, Fumus 11283, Umbra 11284, Cruor 11285, Glacies 11286; it does not provide spawn coordinates.",
  "data_osrs NPCList/npcids do not contain Nex/bodyguard NPC rows; data_osrs locations with overlapping IDs are object/location rows, not NPC spawns.",
  "B237 cache extraction confirms Nex chamber object anchors, but overlapping numeric IDs such as 11278/11284/11285 are object placements, not NPC spawns.",
  "model_dump dump.npc confirms Nex/bodyguard IDs, stats, and model IDs; dbrow/script hits for these IDs are not spawn geometry.",
  "RSMod documents map NPC spawns as a server-only cache group, so client-cache extraction cannot close Nex/bodyguard runtime tiles.",
  "Previously checked blocked/private-server mirrors are not accepted as authority and are no longer tracked as source paths.",
  "Rows below unblock runtime activity work as provisional fixtures only; authoritative OSRS sign-off still requires server-side map NPC/activity configs or live runtime capture.",
]

