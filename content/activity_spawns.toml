  "The wiki tile-marker module gives player strategy markers in region 7216, bounds x=1807..1841/y=3089..3124, but not the authoritative spawn tile.",
  "RuneLite provides IDs only: Sol combat form 12821 and seated form 12827; it does not provide spawn coordinates.",
  "data_osrs NPCList/npcids do not contain Sol NPC rows; data_osrs locations with overlapping IDs are object/location rows, not NPC spawns.",
  "B237 cache extraction confirms pillars at plane 0 and throne object 52514 at plane 1; this corrects only the object anchor, not combat spawn/bounds.",
  "Cache/data_osrs location hits for overlapping 12821/12827 IDs are object placements outside the Sol arena, not Sol NPC spawns.",
  "model_dump dump.npc confirms Sol combat/seated IDs, stats, and model IDs; dbrow/script hits are skill/audio/interface data, not spawn geometry.",
