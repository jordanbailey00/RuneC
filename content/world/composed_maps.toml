# Composed mapsquares (tools/cache_pipeline/rc_cache/compose.py): copies of
# map areas into mapsquares the cache leaves empty, served to every exporter
# as ordinary map files.

# Chambers of Xeric's fixed layout. Each room is the north-exit variant of
# its 32x32 template (x 3296); stacked south to north at x 3472, every room's
# north exit (local x 15-16) opens into the next room's south entry. Rooms
# run easiest to hardest, then the end room with the way down to Great Olm.

