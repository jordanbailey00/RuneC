# Locs that content scripts change at runtime, so the region export can draw
# them as the core object state says.
#
# [[dynamic]]: a map loc whose placements content replaces or removes. Its
# placements export as dynamic bases, and every listed replacement exports
# at the same tile, type and rotation (tools/cache_pipeline/export_objects.py).
#
# [[spawn]]: a loc content adds where the map has none; it exports as a spawn
# template for each rotation (tools/cache_pipeline/export_spawn_objects.py).
# `name` must match the b241 definition name.

# Chambers of Xeric (rc-content/raids/cox_*.c).
