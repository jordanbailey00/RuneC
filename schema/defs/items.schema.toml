  "record: u32 highalch",
  "record: u32 lowalch",
  "record: u32 value",
  "record: u32 linked_id_item, linked_id_noted, linked_id_placeholder, buy_limit (v2)",
  "record: u32 wear_model_ids[7] (v2)",
  "optional equipment block: u8 slot, u8 req_count, reqs, i16 bonuses[14]",
  "optional weapon block: u8 attack_speed, u8 weapon_type, u8 stance_bits, stance names",
]
compatibility = "Loader accepts versions 1 and 2."
